# Yerel geliştirme topolojisi. Dışarıya yalnızca Gateway (5000) açılır; servislerin
# kendi portları host'a yayınlanmaz, birbirlerine compose ağındaki DNS adlarıyla ulaşırlar.

services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "5000:5000"
    environment:
      SERVICES_ACCOUNT: http://account-service:8080
      SERVICES_TRANSFER: http://transfer-service:8082
    depends_on:
      - account-service
      - transfer-service

  account-service:
    build:
      context: .
      dockerfile: services/account-service/Dockerfile
    environment:
      # dev profili: açılışta şema oluşturma + örnek hesaplar (DevDataInitializer).
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://account-db:5432/accounts
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      account-db:
        condition: service_healthy

  transfer-service:
    build:
      context: .
      dockerfile: services/transfer-service/Dockerfile
    environment:
      # 8081: Account Service'in gRPC (HTTP/2) portu.
      SPRING_GRPC_CLIENT_CHANNELS_ACCOUNT_ADDRESS: static://account-service:8081
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      account-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Database-per-service: bu veritabanına yalnızca account-service bağlanır.
  # Kendi verisi olan yeni bir servis eklenirse kendi veritabanı konteynerini getirir.
  account-db:
    image: postgres:17
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - account-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d accounts"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      # Yönetim arayüzü (guest/guest): exchange ve kuyrukları incelemek için.
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  account-db-data:
