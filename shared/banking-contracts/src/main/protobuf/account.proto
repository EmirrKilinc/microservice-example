syntax = "proto3";

option java_package = "com.banking.contracts.grpc";
option java_multiple_files = true;

// Paket adındaki "v1": kontrat kırıcı şekilde değişirse v2 paketi açılır,
// eski istemciler v1 ile çalışmaya devam eder.
package banking.accounts.v1;

// Account Service'in servisler arası (east-west) senkron kontratı.
// Dış dünyaya açılmaz; yalnızca iç ağdaki servisler (ör. transfer-service) çağırır.
service AccountService {
  rpc GetBalance (GetBalanceRequest) returns (GetBalanceReply);
  rpc DebitBalance (DebitBalanceRequest) returns (DebitBalanceReply);
}

message GetBalanceRequest {
  string account_id = 1;
}

message GetBalanceReply {
  string account_id = 1;
  // Protobuf'ta decimal yok. Para, kayan nokta hatası olmasın diye
  // en küçük birim (kuruş/cent) cinsinden tam sayı olarak taşınır.
  int64 balance_minor = 2;
  string currency = 3;
}

message DebitBalanceRequest {
  string account_id = 1;
  int64 amount_minor = 2;
  string currency = 3;
  // Çağıranın ürettiği transfer kimliği. Retry durumunda çift düşümü
  // engellemek (idempotency) için sunucuya taşınır.
  string idempotency_key = 4;
}

message DebitBalanceReply {
  bool success = 1;
  DebitFailureReason failure_reason = 2;
  int64 remaining_balance_minor = 3;
}

// "Yetersiz bakiye" bir hata değil, beklenen bir iş sonucudur; bu yüzden gRPC status
// kodu (StatusRuntimeException) yerine yanıt gövdesinde taşınır. Status kodları altyapı/protokol
// hatalarına (UNAVAILABLE, DEADLINE_EXCEEDED, INVALID_ARGUMENT) ayrılmıştır.
enum DebitFailureReason {
  DEBIT_FAILURE_REASON_UNSPECIFIED = 0;
  DEBIT_FAILURE_REASON_ACCOUNT_NOT_FOUND = 1;
  DEBIT_FAILURE_REASON_INSUFFICIENT_FUNDS = 2;
  DEBIT_FAILURE_REASON_CURRENCY_MISMATCH = 3;
}
